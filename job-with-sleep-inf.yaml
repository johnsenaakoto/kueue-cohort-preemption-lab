# John reclaims his nominal quota, preempting a cohort peer that is borrowing.
apiVersion: batch/v1
kind: Job
metadata:
  name: john-sleep-inf
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: john-queue
spec:
  parallelism: 4
  completions: 4
  template:
    spec:
      containers:
        - name: dummy-job
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/bin/sh"]
          args: ["-c", "sleep 300"]
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
      restartPolicy: Never
